# Example only — `apply sleep` does NOT copy this file.
# Live /etc/limine-entry-tool.d/00-mbp16-1-sleep.conf is generated (omits
# hid_apple.iso_layout=1 if you skipped Apple ISO French).
# Named 00- so this line stays last on the merged cmdline (later drop-ins prepend).
# Do not use KERNEL_CMDLINE[default]= — that wipes drop-ins.
KERNEL_CMDLINE[default]+=" mem_sleep_default=s2idle pcie_ports=compat hid_apple.iso_layout=1"
