# Omarchy T2 installer originally added mem_sleep_default=deep here.
# On MacBookPro16,1 that is wrong: s2idle is the policy (Touch ID NCM + AMD).
# s2idle is set last by /etc/limine-entry-tool.d/00-mbp16-1-sleep.conf.
# Do not put deep back. Use KERNEL_CMDLINE[default]+= only.
KERNEL_CMDLINE[default]+=" intel_iommu=on iommu=pt pm_async=off"
