# mbp16-1: internal keyboard at the LUKS prompt (omacom/omarchy#17755).
#
# Omarchy 4.5 writes zz-omarchy-kernel-modules.conf at install time. It drops
# t2bce_vhci from MODULES for every kernel, so the T2 boot images (linux-t2 and
# linux-t2-mbp161) ship without the T2 USB host and the built-in keyboard is
# dead until root is mounted. This file sorts after it and adds the module
# back. The trailing ? makes it optional, so a kernel without t2bce (for
# example linux-omarchy) still builds.
MODULES+=(t2bce_vhci?)
