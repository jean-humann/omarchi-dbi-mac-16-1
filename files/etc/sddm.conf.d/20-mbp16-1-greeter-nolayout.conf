# MacBookPro16,1: greeter software cursor. Keyboard layout not forced (not ISO French).
# Do not edit /usr/share/sddm/hyprland.lua (Omarchy overwrites it).

[General]
GreeterEnvironment=XCURSOR_THEME=Adwaita,XCURSOR_SIZE=24,HYPRCURSOR_THEME=Adwaita,HYPRCURSOR_SIZE=24

[Theme]
CursorTheme=Adwaita
CursorSize=24

[Wayland]
CompositorCommand=start-hyprland -- --config /etc/sddm/hyprland-mbp16-1-nolayout.lua
