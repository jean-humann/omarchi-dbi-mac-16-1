# MacBookPro16,1: greeter keyboard + software cursor.
# Do not edit /usr/share/sddm/hyprland.lua (Omarchy overwrites it).

[General]
GreeterEnvironment=XCURSOR_THEME=Adwaita,XCURSOR_SIZE=24,HYPRCURSOR_THEME=Adwaita,HYPRCURSOR_SIZE=24,XKB_DEFAULT_LAYOUT=fr,XKB_DEFAULT_VARIANT=mac

[Theme]
CursorTheme=Adwaita
CursorSize=24

[Wayland]
CompositorCommand=start-hyprland -- --config /etc/sddm/hyprland-mbp16-1.lua
