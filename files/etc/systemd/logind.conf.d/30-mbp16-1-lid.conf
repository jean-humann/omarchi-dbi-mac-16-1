# Undocked lid-close → s2idle. Docked (USB-C) stays clamshell, no sleep.
# Wake with the power / Touch ID key or RTC. Letters do not wake.
# Do not suspend on stock linux-t2. Never a second suspend after SMU -62.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
