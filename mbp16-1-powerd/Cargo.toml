[package]
name = "mbp16-1-powerd"
version = "0.1.0"
edition = "2021"
description = "MacBookPro16,1 occupancy + skin RAPL/EPP policy"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
