# MacBookPro16,1 occupancy + skin policy.
# Super menu (power-saver / balanced / performance) is the only UI.
# This file is the envelope table. Do not install TLP / auto-cpufreq / watt.

[general]
interval_s = 1.0
interval_idle_s = 3.0
tau_up_s = 2.5
tau_down_s = 15
# Fade starts here. This chassis sits ~40 °C at desk; 38 was clipping bursts
# before t2fanrd (5 s package mean) had moved any air.
skin_fade_c = 40
busy_core_util = 0.50
hot_core_util = 0.80
firmware_pl1_w = 100
# RAPL PL2 (short-term, ~2.4 ms window). Firmware 125 W. Restored on stop.
firmware_pl2_w = 125
psi_busy_pct = 20
idle_watts = 18
busy_watts = 50

[power-saver]
pl1_idle_w = 22
pl1_busy_w = 32
pl2_w = 70
epp_idle = power
epp_busy = balance_power
skin_hard_c = 40

[balanced]
# Idle PL1 is also the emergency floor. 40 W is unused at true idle (~8 W)
# and keeps UI bursts from slamming to 32 W while fans catch skin.
# Busy 48 W + PL2 70 W (A/B/C test, 2026-11-09): die 93 -> 84 °C under
# sustained all-core load, 0 % of time at TjMax (was 34 %), palm rest and
# trackpad no warmer, -1.7 % sustained throughput, single-thread unchanged.
# Heavy builds: switch to performance.
pl1_idle_w = 40
pl1_busy_w = 48
pl2_w = 70
epp_idle = balance_power
epp_busy = balance_performance
skin_hard_c = 43

[performance]
pl1_idle_w = 45
pl1_busy_w = 80
# 0 = firmware PL2 (125 W).
pl2_w = 0
epp_idle = balance_performance
epp_busy = performance
skin_hard_c = 43
